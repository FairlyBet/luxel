# WebAssembly SIMD (128-bit) for the wasm target: glam's Vec4/Mat4 then use
# v128 instructions. Supported by every current browser (Chrome 91+, Firefox
# 89+, Safari 16.4+); the bundle comes out ~0.5% smaller.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

# The browser test runner's time per test file (default 20 s): the texture
# compression tests compile ETC / BC6H encoders that take ANGLE's D3D shader
# compiler over ten seconds.
[env]
WASM_BINDGEN_TEST_TIMEOUT = "60"
