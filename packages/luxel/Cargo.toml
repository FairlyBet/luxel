[package]
name = "luxel"
version = "0.1.0"
edition = "2024"
autotests = false
description = "Scene for luxel-gl on luxel-ecs: transforms, hierarchy, culling, draw-list assembly, glTF models, the JS facade"

# cdylib: `wasm-pack build packages/luxel --target web` is the JS bundle
# (renderer + glTF loader + scene in one module).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
luxel-gl = { workspace = true }
luxel-ecs = { path = "../luxel-ecs" }
luxel-gltf = { path = "../luxel-gltf" }
glam = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
tracing = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventTarget", "WebGl2RenderingContext"] }

# Host tests: `cargo test -p luxel`.
# Browser tests: `wasm-pack test --headless --chrome packages/luxel`.
[dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
base64 = "0.22"
web-sys = { workspace = true, features = ["Document", "Event", "EventTarget", "HtmlCanvasElement", "WebGl2RenderingContext"] }

[[test]]
name = "integration"
path = "tests/main.rs"
