[workspace]
members = [
    "packages/rswebgl",
    "packages/rswebgl-gltf",
    "packages/rswebgl-foundation",
    "packages/rswebgl-ecs",
    "packages/rswebgl-scene",
    "examples/cube",
    "examples/cubemap",
    "examples/texture",
    "examples/gltf",
    "examples/scene",
]
resolver = "3"

[workspace.dependencies]
rswebgl = { path = "packages/rswebgl" }
smallvec = "1"
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
glam = "0.30"
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Measured on Sponza (wasm / gzip): "s" 1.58 / 0.56 MB, 3 1.75 / 0.61 MB,
# "z" 1.43 / 0.52 MB; frame CPU differed by less than run-to-run noise.
# simd128 is switched on in .cargo/config.toml.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
